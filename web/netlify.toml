[build]
  base = "web/"
  publish = "out"
  command = "pnpm install --frozen-lockfile=false && pnpm build"
  ignore = "[[ -z $CACHED_COMMIT_REF ]] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "text/xml"
